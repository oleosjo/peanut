<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03030a" />
    <meta name="description" content="Pilot a tiny peanut through a very large asteroid field." />
    <title>Peanut Space Program</title>
    <link rel="icon" type="image/jpeg" href="peanut.jpg" />
    <link rel="preload" href="peanut.glb" as="fetch" crossorigin="anonymous" />
    <link rel="stylesheet" href="game.css" />
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <main id="game" aria-label="Peanut Space Program game">
        <canvas id="space" aria-hidden="true"></canvas>

        <header class="hud" aria-live="polite">
            <div class="brand">
                <span class="brand__dot"></span>
                <span>PEANUT SPACE PROGRAM</span>
            </div>
            <div class="stats">
                <div class="stat">
                    <span class="stat__label">DISTANCE</span>
                    <strong id="score">0000</strong><span class="stat__unit">KM</span>
                </div>
                <div class="stat">
                    <span class="stat__label">BEST</span>
                    <strong id="best">0000</strong><span class="stat__unit">KM</span>
                </div>
            </div>
        </header>

        <div class="speed" aria-hidden="true">
            <span>SPEED</span>
            <div class="speed__track"><div id="speed-bar" class="speed__bar"></div></div>
        </div>

        <section id="intro" class="panel">
            <p class="eyebrow">DEEP SPACE SNACK DIVISION</p>
            <h1>GO NUTS.</h1>
            <p class="lede">Fly the peanut. Dodge the rocks.<br />Try not to become space butter.</p>
            <div class="controls">
                <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
                <span>OR ARROW KEYS TO STEER</span>
            </div>
            <button id="start" type="button" disabled>
                <span id="start-label">LOADING PEANUT…</span>
                <span aria-hidden="true">↗</span>
            </button>
        </section>

        <section id="game-over" class="panel panel--hidden">
            <p class="eyebrow">MISSION REPORT</p>
            <h2>CRUNCH.</h2>
            <p class="lede">Your peanut travelled <strong id="final-score">0 km</strong>.</p>
            <button id="restart" type="button">
                <span>TRY AGAIN</span>
                <span aria-hidden="true">↻</span>
            </button>
        </section>

        <p id="hint" class="hint">USE WASD OR ARROW KEYS</p>
        <div id="flash" class="flash"></div>
    </main>

    <script type="module" src="game.js"></script>
</body>
</html>
