<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>A single peanut.</title>
        <link rel="icon" type="image/jpeg" href="peanut.jpg" />

        <script
            type="module"
            src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"
        ></script>

        <style>
            /* This ensures the model takes up the full screen */
            body {
                margin: 0;
                height: 100vh;
                background-color: #fff;
            }
            model-viewer {
                width: 100%;
                height: 100%;
                --poster-color: transparent;
            }
        </style>
    </head>
    <body>
        <div class="grid-background">
            <div class="grid-floor"></div>
            <div class="horizon-glow"></div>
        </div>
        <model-viewer
            src="peanut.glb"
            alt="A single peanut."
            auto-rotate
            interaction-prompt="none"
            camera-controls
            shadow-intensity="1"
            touch-action="pan-y"
            camera-orbit="70deg auto 450%"
            min-camera-orbit="auto auto 150%"
            max-camera-orbit="auto auto 500%"
        >
        </model-viewer>
    </body>
</html>
